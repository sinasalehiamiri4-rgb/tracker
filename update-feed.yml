# مسیر در ریپو: .github/workflows/update-feed.yml
name: update-feed
on:
  schedule: [{cron: '*/30 * * * *'}]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - run: node update-feed.mjs
      - run: |
          git config user.name "feed-bot"; git config user.email "bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "update feed" && git push)
