<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AniTracker Hub</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2048%2048%22%3E%3Crect%20width%3D%2248%22%20height%3D%2248%22%20rx%3D%2212%22%20fill%3D%22%231e2029%22%20stroke%3D%22%232d3139%22/%3E%3Ccircle%20cx%3D%2224%22%20cy%3D%2224%22%20r%3D%2215%22%20fill%3D%22none%22%20stroke%3D%22%232d3139%22%20stroke-width%3D%223%22/%3E%3Cpath%20d%3D%22M24%209a15%2015%200%201%201-13.5%208.5%22%20fill%3D%22none%22%20stroke%3D%22%236366f1%22%20stroke-width%3D%223%22%20stroke-linecap%3D%22round%22/%3E%3Ccircle%20cx%3D%2210.5%22%20cy%3D%2217.5%22%20r%3D%222.6%22%20fill%3D%22%23f59e0b%22/%3E%3Cpath%20d%3D%22M20%2017.5v13l11-6.5z%22%20fill%3D%22%23fff%22/%3E%3C/svg%3E">
<meta name="theme-color" content="#16181f">
<style>
:root{--bg:#0f1015;--side:#16181f;--card:#1e2029;--text:#fff;--muted:#9ca3af;--accent:#6366f1;--accent2:#4f46e5;--ok:#10b981;--warn:#f59e0b;--line:#2d3139}
*{box-sizing:border-box}
body{font-family:Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text);margin:0}
header{background:var(--side);padding:15px 30px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
.logo{display:flex;align-items:center;gap:10px;font-size:1.4rem;font-weight:normal;color:var(--text);text-decoration:none;letter-spacing:.3px}
.logo b{color:var(--accent)}
.logo .mark{width:38px;height:38px;flex:none}
.container{max-width:1200px;margin:30px auto;padding:0 20px}
.admin{background:var(--side);padding:20px;border-radius:12px;border:1px solid var(--line);margin-bottom:30px}
.admin h3{margin:0 0 15px;color:var(--accent);font-size:1.1rem}
.form{display:flex;gap:12px;flex-wrap:wrap}
.form input,.form select{background:var(--bg);border:1px solid var(--line);color:#fff;padding:10px 15px;border-radius:8px;font-family:inherit;flex:1;min-width:180px}
button{font-family:inherit}
.form button{background:var(--accent);color:#fff;border:0;padding:10px 20px;border-radius:8px;font-weight:bold;cursor:pointer}
.form button:hover{background:var(--accent2)}
.form button:disabled{opacity:.6;cursor:wait}
:focus-visible{outline:2px solid var(--warn);outline-offset:2px}
h2{border-right:4px solid var(--accent);padding-right:12px;margin-bottom:20px;font-size:1.3rem}
.tabs{display:flex;gap:10px;margin-bottom:25px;overflow-x:auto;padding-bottom:5px}
.tab{background:var(--side);color:var(--muted);border:1px solid var(--line);padding:10px 20px;border-radius:8px;cursor:pointer;font-weight:bold;white-space:nowrap}
.tab.active,.tab:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:20px}
.card{background:var(--card);border-radius:12px;overflow:hidden;box-shadow:0 4px 10px rgba(0,0,0,.3);border:1px solid var(--line);display:flex;flex-direction:column}
.img{width:100%;aspect-ratio:2/3;position:relative;overflow:hidden;background:linear-gradient(110deg,#181a22 30%,#242733 50%,#181a22 70%);background-size:200% 100%;animation:sk 1.4s linear infinite}
.img.loaded{animation:none;background:#111}
@keyframes sk{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.img{animation:none}}
.img img{width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .3s}
.img.loaded img{opacity:1}
.badge{position:absolute;top:10px;left:10px;background:rgba(0,0,0,.75);color:var(--accent);padding:5px 12px;border-radius:6px;font-size:.8rem;font-weight:bold;z-index:2}
.del{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.75);color:#f87171;border:0;border-radius:6px;width:30px;height:30px;cursor:pointer;z-index:2}
.body{padding:15px;flex:1}
.title{margin:0 0 6px;font-size:1.05rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{color:var(--muted);font-size:.8rem;margin-bottom:8px}
.timer{font-size:.95rem;color:var(--warn);font-weight:bold}
.timer.out{color:var(--ok)}
.actions{padding:0 15px 15px;display:grid;gap:8px}
.btn{background:var(--accent);color:#fff;text-decoration:none;text-align:center;padding:10px;border-radius:8px;display:block;font-weight:bold;border:0;cursor:pointer;font-size:.9rem}
.btn:hover{background:var(--accent2)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--muted)}
.btn.ghost:hover{border-color:var(--accent);color:#fff}
.btn.ok{background:var(--ok)}
.empty{color:var(--muted);grid-column:1/-1;text-align:center}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:30px 15px;overflow:auto}
.modal[hidden]{display:none}
.box{background:var(--side);border:1px solid var(--line);border-radius:12px;padding:20px;width:100%;max-width:900px}
.res{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;margin:15px 0}
.r{background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:hidden;cursor:pointer;color:#fff;padding:0;text-align:right}
.r:hover{border-color:var(--accent)}
.r img{width:100%;aspect-ratio:2/3;object-fit:cover;display:block;background:#111}
.r div{padding:8px;font-size:.8rem}
.r small{color:var(--muted);display:block;margin-top:3px}
.hbtns{display:flex;gap:8px;align-items:center}
.menu{position:relative}
.menu summary{list-style:none;cursor:pointer}
.menu summary::-webkit-details-marker{display:none}
.menubox{position:absolute;left:0;top:calc(100% + 6px);background:var(--side);border:1px solid var(--line);border-radius:10px;padding:8px;display:grid;gap:6px;min-width:190px;z-index:20;box-shadow:0 8px 24px rgba(0,0,0,.5)}
#admin{z-index:40}
.mhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.fld{display:grid;gap:5px;font-size:.8rem;color:var(--muted)}
.fld[hidden]{display:none}
.fld.wide{grid-column:1/-1}
.fld input,.fld select{background:var(--bg);border:1px solid var(--line);color:#fff;padding:10px 12px;border-radius:8px;font-family:inherit;font-size:.9rem}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ok);color:#fff;padding:10px 18px;border-radius:8px;z-index:99;font-weight:bold}
.toast[hidden]{display:none}
.hbtns .btn{padding:8px 12px;font-size:.8rem}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}
.bar input,.bar select,.state{background:var(--side);border:1px solid var(--line);color:#fff;padding:9px 12px;border-radius:8px;font-family:inherit;flex:1;min-width:130px}
.row{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.row .btn{padding:8px 4px;font-size:.78rem}
header{padding-top:max(15px,env(safe-area-inset-top))}
@media(max-width:700px){header{padding:12px 14px;flex-wrap:wrap;gap:10px}.logo{font-size:1.2rem}.container{margin:16px auto;padding:0 12px}.grid{grid-template-columns:repeat(2,1fr);gap:12px}.admin{padding:14px}.form input,.form select,.form button{flex:1 1 100%;min-height:44px}.btn,.tab,.state{min-height:44px}.badge{font-size:.7rem;padding:3px 8px}.title{font-size:.95rem}.timer{font-size:.8rem}.body{padding:10px}.actions{padding:0 10px 10px}.modal{padding:12px}.res{grid-template-columns:repeat(2,1fr)}}
@media(max-width:360px){.grid{grid-template-columns:1fr}}
.btn[hidden]{display:none}
.seg{display:flex;gap:4px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:4px;margin-bottom:16px}
.seg button{flex:1;background:transparent;border:0;color:var(--muted);padding:9px;border-radius:7px;cursor:pointer;font-weight:bold}
.seg button.on{background:var(--accent);color:#fff}
.hint{color:var(--muted);font-size:.85rem;margin:12px 0 0}
#admin .box{max-width:640px}
#admin .res{margin:12px 0}
#manBtn,#mAdd{width:100%}
.more{margin:14px 0;border:1px dashed var(--line);border-radius:8px;padding:10px 12px}
.more summary{cursor:pointer;color:var(--muted);font-size:.85rem}
.more .fgrid{margin-top:12px}
@media(max-width:700px){#admin{align-items:flex-end;padding:0}#admin .box{border-radius:16px 16px 0 0;max-height:92vh;overflow:auto}}
</style>
</head>
<body>
<header>
  <a class="logo" href="./" aria-label="AniTracker"><svg class="mark" viewBox="0 0 48 48" aria-hidden="true"><rect width="48" height="48" rx="12" fill="#1e2029" stroke="#2d3139"/><circle cx="24" cy="24" r="15" fill="none" stroke="#2d3139" stroke-width="3"/><path d="M24 9a15 15 0 1 1-13.5 8.5" fill="none" stroke="#6366f1" stroke-width="3" stroke-linecap="round"/><circle cx="10.5" cy="17.5" r="2.6" fill="#f59e0b"/><path d="M20 17.5v13l11-6.5z" fill="#fff"/></svg><span>Ani<b>Tracker</b></span></a>
  <div class="hbtns">
    <button class="btn" id="adminBtn">🛠 پنل ادمین</button>
    <details class="menu">
      <summary class="btn ghost">⚙️ تنظیمات</summary>
      <div class="menubox">
        <button class="btn ghost" id="tplBtn">🔗 سایت دانلود</button>
        <button class="btn ghost" id="delayBtn">⏱ تأخیر آپلود</button>
        <button class="btn ghost" id="notifBtn">🔔 اعلان</button>
        <button class="btn ghost" id="expBtn">💾 خروجی بکاپ</button>
        <button class="btn ghost" id="impBtn">📂 ورود بکاپ</button>
        <input type="file" id="impIn" accept="application/json" hidden>
      </div>
    </details>
  </div>
</header>

<div class="container">
    <h2>📅 جدول پخش هفتگی</h2>
  <div class="tabs" id="tabs"></div>
  <div class="bar">
    <input type="search" id="q" placeholder="جستجو در لیست...">
    <select id="stF"><option value="all">همه وضعیت‌ها</option><option value="watching">در حال دیدن</option><option value="later">بعداً</option><option value="done">دیده شده</option></select>
    <select id="sortF"><option value="added">ترتیب افزودن</option><option value="time">نزدیک‌ترین پخش</option><option value="name">نام</option></select>
  </div>
  <div class="grid" id="grid"></div>
</div>

<div class="modal" id="admin" hidden>
  <div class="box" role="dialog" aria-modal="true" aria-labelledby="adTitle">
    <div class="mhead"><strong id="adTitle">🛠 افزودن به لیست</strong><button class="btn ghost" id="adClose" aria-label="بستن" style="padding:6px 14px">✕</button></div>
    <div class="seg"><button class="on" data-p="auto">🔎 جستجوی خودکار</button><button data-p="man">✍️ افزودن دستی</button></div>
    <section id="pAuto">
      <div class="form">
        <input type="search" id="nameIn" placeholder="نام انگلیسی: Naruto ، Inception 2 ..." autocomplete="off">
        <select id="dayIn" aria-label="روز پخش"><option value="auto">روز: خودکار</option><option value="saturday">شنبه</option><option value="sunday">یکشنبه</option><option value="monday">دوشنبه</option><option value="tuesday">سه‌شنبه</option><option value="wednesday">چهارشنبه</option><option value="thursday">پنجشنبه</option><option value="friday">جمعه</option></select>
        <button id="addBtn">جستجو</button>
      </div>
      <p class="hint" id="resHint">نام را بنویس و Enter بزن؛ نتیجه‌ها همین‌جا و به‌محض رسیدن نمایش داده می‌شوند.</p>
      <div class="res" id="res"></div>
      <button class="btn ghost" id="manBtn" hidden>پیدا نشد؟ افزودن دستی با همین نام</button>
    </section>
    <section id="pMan" hidden>
      <div class="fgrid">
        <label class="fld">نوع<select id="mType"><option value="movie">فیلم</option><option value="show">سریال</option><option value="anime">انیمه</option></select></label>
        <label class="fld">نام (انگلیسی)<input id="mName" placeholder="Stranglehold"></label>
        <label class="fld">سال<input id="mYear" inputmode="numeric" placeholder="2026"></label>
        <label class="fld" data-s hidden>روز پخش<select id="mDay"></select></label>
        <label class="fld" data-s hidden>شماره قسمت<input id="mEp" type="number" min="1" value="1"></label>
        <label class="fld wide">لینک صفحه‌ی زرفیلم (اختیاری؛ نام و سال را خودش پر می‌کند)<input id="mZar" placeholder="https://zarfilm.com/stranglehold-2026/"></label>
      </div>
      <details class="more"><summary>گزینه‌های بیشتر (عکس و لینک دانلود)</summary>
        <div class="fgrid">
          <label class="fld wide">لینک عکس (خالی بماند خودش پیدا می‌کند)<input id="mImg"></label>
          <label class="fld wide">لینک دانلود<input id="mLink"></label>
        </div>
      </details>
      <button class="btn" id="mAdd">ذخیره</button>
    </section>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script>
const DAYS=[['all','همه'],['saturday','شنبه'],['sunday','یکشنبه'],['monday','دوشنبه'],['tuesday','سه‌شنبه'],['wednesday','چهارشنبه'],['thursday','پنجشنبه'],['friday','جمعه'],['movie','🎬 فیلم‌ها']];
const JS_DAY={sunday:0,monday:1,tuesday:2,wednesday:3,thursday:4,friday:5,saturday:6};
const TYPE_FA={anime:'انیمه',show:'سریال',movie:'فیلم'};
const KEY='anitracker_v2';
const DOPT=DAYS.slice(1,8).map(([k,l])=>'<option value="'+k+'">'+l+'</option>').join('');
const FMT=new Intl.DateTimeFormat('fa-IR',{weekday:'long',month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
let TM=[];
const PH='data:image/svg+xml;utf8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="300" height="450"><rect width="100%" height="100%" fill="#1e2029"/><text x="50%" y="50%" fill="#6b7280" font-size="20" text-anchor="middle" font-family="Arial">No Image</text></svg>');
const $=id=>document.getElementById(id);
const toFa=n=>String(n).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);

function load(){
  try{const s=JSON.parse(localStorage.getItem(KEY));if(Array.isArray(s))return s}catch(e){}
  return [
    {id:uid(),name:'Black Clover',day:'saturday',type:'anime',episode:1,image:'',target:0,link:''},
    {id:uid(),name:'Blue Box',day:'sunday',type:'anime',episode:1,image:'',target:0,link:''},
    {id:uid(),name:'The Prince of Tennis',day:'wednesday',type:'anime',episode:1,image:'',target:0,link:''}
  ];
}
let list=load(),filter='all',pending=null;
let svT;const flush=()=>{clearTimeout(svT);try{localStorage.setItem(KEY,JSON.stringify(list))}catch(e){}};
const save=()=>{clearTimeout(svT);svT=setTimeout(flush,300)};
addEventListener('pagehide',flush);document.addEventListener('visibilitychange',()=>{if(document.hidden)flush()});
// تاریخ‌های خیلی دور (مثلاً ۵۵ روز) برای سریال هفتگی غلط‌اند؛ به نزدیک‌ترین روز هفته برمی‌گردند
const dayKey=ms=>['sunday','monday','tuesday','wednesday','thursday','friday','saturday'][new Date(ms).getDay()];
function fixTarget(it){
  if(it.type==='movie'||it.finished)return;
  const far=it.target-Date.now()>10*864e5;
  if(!it.target||(far&&!it.upcoming)){it.target=nextFromDay(it.day);it.guess=true}
}
const delayMs=()=>{try{return (+localStorage.getItem('anitracker_delay')||0)*36e5}catch(e){return 0}};
function notify(it){
  if(it.notified||it.type==='movie')return;
  it.notified=true;save();
  if('Notification' in window&&Notification.permission==='granted')new Notification('قسمت جدید: '+it.name,{body:'قسمت '+it.episode+' منتشر شد'});
}
list.forEach(it=>{if(!it.state)it.state='watching';fixTarget(it)});save();

/* ---- زمان‌ها ---- */
function nextFromBroadcast(day,time){
  const m=/^(\d{1,2}):(\d{2})$/.exec(time||'');
  const idx=['sunday','monday','tuesday','wednesday','thursday','friday','saturday'].indexOf((day||'').toLowerCase().replace(/s$/,''));
  if(!m||idx<0)return 0;
  const jst=Date.now()+9*3600e3,b=new Date(jst);
  for(let i=0;i<=7;i++){
    const c=Date.UTC(b.getUTCFullYear(),b.getUTCMonth(),b.getUTCDate()+i,+m[1],+m[2]);
    if(new Date(c).getUTCDay()===idx&&c>jst)return c-9*3600e3;
  }
  return 0;
}
function nextFromDay(k){
  const d=new Date();d.setHours(20,0,0,0);
  let a=(JS_DAY[k]-d.getDay()+7)%7;
  if(a===0&&d<=new Date())a=7;
  d.setDate(d.getDate()+a);return d.getTime();
}

/* ---- منابع جستجو ---- */
const getJSON=async(u,ms=5000,sg)=>{const c=new AbortController(),t=setTimeout(()=>c.abort(),ms);if(sg)sg.addEventListener('abort',()=>c.abort(),{once:true});try{const r=await fetch(u,{signal:c.signal});if(!r.ok)throw 0;return await r.json()}finally{clearTimeout(t)}};

async function sMAL(q,sg){
  const j=await getJSON('https://api.jikan.moe/v4/anime?limit=5&sfw=true&q='+encodeURIComponent(q),6000,sg);
  return j.data.map(a=>{const im=a.images.webp||a.images.jpg;return{
    src:'MyAnimeList',type:'anime',status:a.status,title:a.title,year:a.year||'',
    image:im.large_image_url||im.image_url,
    target:nextFromBroadcast(a.broadcast&&a.broadcast.day,a.broadcast&&a.broadcast.time)}});
}
async function sIMDB(q,sg){
  const c=(q.trim()[0]||'x').toLowerCase();
  const k=/[a-z0-9]/.test(c)?c:'x';
  const j=await getJSON('https://v2.sg.media-imdb.com/suggestion/'+k+'/'+encodeURIComponent(q.trim())+'.json',4000,sg);
  return (j.d||[]).filter(x=>x.i&&x.l&&x.id&&x.id.startsWith('tt')).slice(0,6).map(x=>({
    src:'IMDb',type:/series|episode/i.test(x.q||'')?'show':'movie',title:x.l,year:x.y||'',image:x.i.imageUrl,target:0}));
}
async function sTV(q,sg){
  const j=await getJSON('https://api.tvmaze.com/search/shows?q='+encodeURIComponent(q),4000,sg);
  return j.slice(0,5).map(x=>({
    src:'TVmaze',type:'show',title:x.show.name,year:(x.show.premiered||'').slice(0,4),
    image:x.show.image&&(x.show.image.original||x.show.image.medium)||'',target:0,tvid:x.show.id}));
}
async function searchAll(q){
  const rs=await Promise.allSettled([sMAL(q),sIMDB(q),sTV(q)]);
  return rs.flatMap(r=>r.status==='fulfilled'?r.value:[]);
}

/* ---- ذخیره عکس داخل مرورگر (تا بعداً هم بیاید) ---- */
async function cacheImg(url){
  if(!url||url.startsWith('data:'))return url;
  try{
    const b=await (await fetch(url,{signal:AbortSignal.timeout(8000)})).blob();
    const bm=await createImageBitmap(b);
    const w=240,h=Math.round(bm.height*w/bm.width);
    const cv=document.createElement('canvas');cv.width=w;cv.height=h;
    cv.getContext('2d').drawImage(bm,0,0,w,h);
    return cv.toDataURL('image/jpeg',.7);
  }catch(e){return url}
}

/* ---- افزودن ---- */
async function addFrom(p,manualImg,done){
  let day=$('dayIn').value;if(day==='auto')day='saturday';
  const it={id:uid(),name:p.title,day,type:p.type||'anime',year:p.year||'',episode:1,
    image:manualImg||p.image||'',target:p.target||0,link:'',state:'watching',finished:p.status==='Finished Airing',upcoming:p.status==='Not yet aired'};
  if(!p.tvid&&it.type!=='movie'&&!it.target){
    try{const r=(await sTV(p.title)).find(x=>x.title.toLowerCase()===p.title.toLowerCase());if(r)p.tvid=r.tvid}catch(e){}
  }
  if(p.tvid){
    try{
      const j=await getJSON('https://api.tvmaze.com/shows/'+p.tvid+'?embed=nextepisode');
      const e=j._embedded&&j._embedded.nextepisode;
      if(e){it.target=new Date(e.airstamp).getTime();it.episode=e.number||1;it.season=e.season}
    }catch(e){}
  }
  fixTarget(it);
  if(!it.guess&&it.type!=='movie'&&it.target)it.day=dayKey(it.target); // روز تب = روز واقعی پخش به وقت خودت
  list.push(it);save();render();done&&done(it);
  const cached=await cacheImg(it.image);
  if(cached!==it.image){it.image=cached;save();render();}
}
const lbl=p=>TYPE_FA[p.type]+(p.year?' • '+p.year:'')+' • '+p.src+(p.status?' • '+({'Currently Airing':'در حال پخش','Finished Airing':'تمام‌شده','Not yet aired':'به‌زودی'}[p.status]||p.status):'')+(p.type==='movie'||p.status==='Finished Airing'?'':p.target?' • ⏰ '+FMT.format(p.target):p.src==='IMDb'?' • زمان پخش بعد از افزودن پیدا می‌شود':' • زمان پخش نامشخص');
function addResults(items){
  const f=document.createDocumentFragment();
  items.forEach(p=>{
    const b=document.createElement('button');b.className='r';
    const im=document.createElement('img');im.referrerPolicy='no-referrer';im.loading='lazy';im.decoding='async';
    im.onerror=()=>{im.onerror=null;im.src=PH};im.src=p.image||PH;
    const d=document.createElement('div');d.textContent=p.title;
    const sm=document.createElement('small');
    sm.textContent=lbl(p);
    d.appendChild(sm);b.append(im,d);
    b.onclick=()=>{$('admin').hidden=true;addFrom(p,'',it=>toast('«'+p.title+'» اضافه شد'+(it.type==='movie'?'':it.guess?' — زمان پخش پیدا نشد، تخمینی است':' — پخش: '+FMT.format(it.target))))};
    if(p.tvid)getJSON('https://api.tvmaze.com/shows/'+p.tvid+'?embed=nextepisode',4000).then(j=>{const e=j._embedded&&j._embedded.nextepisode;if(e){p.target=new Date(e.airstamp).getTime();sm.textContent=lbl(p)}}).catch(()=>{});
    f.appendChild(b);
  });
  $('res').appendChild(f);
}
/* جستجوی همزمان؛ هر منبع به‌محض رسیدن نشان داده می‌شود، timeout دارد و نتیجه کش می‌شود */
const SC=new Map();let sCtl,sid=0;
function searchProg(q,on){
  const k=q.toLowerCase();
  if(SC.has(k)){on(SC.get(k));return Promise.resolve()}
  if(sCtl)sCtl.abort();sCtl=new AbortController();const sg=sCtl.signal,all=[];
  return Promise.allSettled([sIMDB(q,sg),sTV(q,sg),sMAL(q,sg)].map(p=>p.then(r=>{if(sg.aborted)return;all.push(...r);if(r.length)on(r)}))).then(()=>{if(!sg.aborted&&all.length)SC.set(k,all)});
}
async function doSearch(){
  const name=$('nameIn').value.trim(),my=++sid,hint=$('resHint');
  if(!name){$('nameIn').focus();return}
  $('res').textContent='';$('manBtn').hidden=true;hint.textContent='⏳ در حال جستجو...';
  let n=0;
  await searchProg(name,r=>{if(my!==sid)return;n+=r.length;addResults(r);hint.textContent='⏳ می‌توانی همین حالا انتخاب کنی؛ منابع دیگر هنوز در راه‌اند...'});
  if(my!==sid)return;
  hint.textContent=n?'نتیجه‌ی مورد نظر را انتخاب کن.':'چیزی پیدا نشد (شاید اینترنت یا VPN). می‌توانی دستی اضافه کنی.';
  $('manBtn').hidden=false;
}
$('addBtn').onclick=doSearch;
$('nameIn').addEventListener('keydown',e=>{if(e.key==='Enter')doSearch()});
function pane(p){
  document.querySelectorAll('.seg button').forEach(b=>b.classList.toggle('on',b.dataset.p===p));
  $('pAuto').hidden=p!=='auto';$('pMan').hidden=p!=='man';
  setTimeout(()=>$(p==='auto'?'nameIn':'mName').focus(),0);
}
document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>pane(b.dataset.p));
$('manBtn').onclick=()=>{$('mName').value=$('nameIn').value.trim();pane('man')};

/* ---- عکس‌های خالی را خودکار پر کن ---- */
async function fillMissing(){
  for(const it of list){
    if(it.image||it.imgTried)continue;it.imgTried=true;
    const r=(await searchAll(it.name)).find(x=>x.image);
    if(r){it.image=await cacheImg(r.image);if(!it.target)it.target=r.target||nextFromDay(it.day);save();render()}
    await new Promise(s=>setTimeout(s,500));
  }
  save();let ch=false;list.forEach(i=>{if(!i.target&&i.type!=='movie'){i.target=nextFromDay(i.day);ch=true}});
  if(ch){save();render()}
}

/* ---- لینک دانلود ---- */
function slug(s){return s.toLowerCase().replace(/['’]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'')}
function zarUrl(it){
  const s=slug(it.name);if(!s)return '';
  return it.type==='movie'&&it.year?'https://zarfilm.com/'+s+'-'+it.year+'/#dlbox':'https://zarfilm.com/series/'+s+'/#dlbox';
}
function searchUrl(it){return 'https://zarfilm.com/?s='+encodeURIComponent(it.name)}
function dlLink(it){
  const ep=String(it.episode).padStart(2,'0');
  const fill=s=>s.replace(/\{ep\}/g,ep).replace(/\{name\}/g,encodeURIComponent(it.name)).replace(/\{year\}/g,it.year||'');
  if(it.link)return fill(it.link);
  let tpl='';try{tpl=localStorage.getItem('anitracker_tpl')||''}catch(e){}
  if(tpl&&!/zarfilm\.com/i.test(tpl))return fill(tpl);
  return zarUrl(it)||fill('https://zarfilm.com/?s={name}');
  return 'https://www.google.com/search?q='+encodeURIComponent(it.name+(it.type==='movie'?' '+(it.year||''):' episode '+ep)+' download');
}

/* ---- رندر ---- */
function render(){
  const grid=$('grid');grid.textContent='';TM=[];
  const q=$('q').value.trim().toLowerCase(),st=$('stF').value,so=$('sortF').value;
  const items=list.filter(i=>(filter==='all'||(filter==='movie'?i.type==='movie':i.type!=='movie'&&i.day===filter))&&(!q||i.name.toLowerCase().includes(q))&&(st==='all'||(i.state||'watching')===st));
  if(so==='time')items.sort((a,b)=>(a.target||9e15)-(b.target||9e15));
  else if(so==='name')items.sort((a,b)=>a.name.localeCompare(b.name));
  if(!items.length){
    const p=document.createElement('p');p.className='empty';
    p.textContent='چیزی برای این روز ثبت نشده. از بالا جستجو و اضافه کنید.';
    grid.appendChild(p);return;
  }
  const fr=document.createDocumentFragment();
  items.forEach(it=>{
    const movie=it.type==='movie';
    const c=document.createElement('div');c.className='card';
    c.innerHTML=`
      <div class="img"><span class="badge"></span>
        <button class="del" title="حذف" aria-label="حذف">✕</button>
        <img loading="lazy" decoding="async" referrerpolicy="no-referrer" alt=""></div>
      <div class="body"><h3 class="title"></h3><div class="meta"></div>
        <div class="timer" data-id="${it.id}"></div><div class="meta when"></div></div>
      <div class="actions">
        <a class="btn dl" target="_blank" rel="noopener"></a>
        <a class="btn ghost srch" target="_blank" rel="noopener">🔎 پیدا نشد؟ جستجو در زرفیلم</a>
        <button class="btn ok next" hidden>✔ دانلود شد، قسمت بعدی</button>
        <div class="row"><button class="btn ghost setlink">✏️ لینک</button><button class="btn ghost setimg">🖼 عکس</button><button class="btn ghost settime">⏰ زمان</button></div><select class="dayS">${DOPT}</select><select class="state"><option value="watching">در حال دیدن</option><option value="later">بعداً</option><option value="done">دیده شده</option></select>
        
      </div>`;
    c.querySelector('.badge').textContent=movie?'فیلم':'قسمت '+toFa(it.episode);
    const t=c.querySelector('.title');t.textContent=it.name;t.title=it.name;
    c.querySelector('.meta').textContent=(TYPE_FA[it.type]||'')+(it.year?' • '+it.year:'');
    c.querySelector('.dl').textContent=movie?'⬇ دانلود فیلم':'⬇ دانلود قسمت جدید';
    if(movie)c.querySelector('.timer').remove();else TM.push({it,el:c.querySelector('.timer'),nb:c.querySelector('.next'),w:c.querySelector('.when')});
    const box=c.querySelector('.img'),img=c.querySelector('img');
    img.alt=it.name;
    img.onload=()=>box.classList.add('loaded');
    img.onerror=()=>{img.onerror=null;img.src=PH};
    img.src=it.image||PH;
    c.querySelector('.dl').href=dlLink(it);
    c.querySelector('.srch').href=searchUrl(it);
    const ds=c.querySelector('.dayS');ds.value=it.day;
    ds.onchange=()=>{it.day=ds.value;if(it.type!=='movie'&&!it.finished){it.target=nextFromDay(it.day);it.guess=true;it.upcoming=false;it.notified=false}save();render()};
    const sel=c.querySelector('.state');sel.value=it.state||'watching';sel.onchange=()=>{it.state=sel.value;save()};
    c.querySelector('.settime').onclick=()=>{
      const v=prompt('زمان پخش قسمت بعدی (به وقت خودت). مثال: 2026-10-11 17:30',it.target?new Date(it.target-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,16).replace('T',' '):'');
      if(!v)return;const d=new Date(v.trim().replace(' ','T'));
      if(isNaN(d)){alert('فرمت درست نیست.');return}
      it.target=d.getTime();it.guess=false;it.finished=false;it.upcoming=true;it.notified=false;save();render();
    };
    c.querySelector('.del').onclick=()=>{if(confirm('«'+it.name+'» حذف شود؟')){list=list.filter(x=>x.id!==it.id);save();render()}};
    c.querySelector('.next').onclick=()=>{
      it.episode++;it.notified=false;it.guess=false;it.target=(it.target||Date.now())+7*864e5;
      while(it.target<Date.now())it.target+=7*864e5;
      save();render();
    };
    c.querySelector('.setlink').onclick=()=>{
      const v=prompt('لینک دانلود (برای شماره قسمت از {ep} استفاده کنید):',it.link||'');
      if(v!==null){it.link=v.trim();save();render()}
    };
    c.querySelector('.setimg').onclick=async()=>{
      const v=prompt('لینک عکس را وارد کنید:',it.image&&!it.image.startsWith('data:')?it.image:'');
      if(v){it.image=v.trim();save();render();const d=await cacheImg(it.image);if(d!==it.image){it.image=d;save();render()}}
    };
    fr.appendChild(c);
  });
  grid.appendChild(fr);
  updateTimers(true);
}
function updateTimers(first){
  if(document.hidden&&!first)return;
  const dl=delayMs(),now=Date.now(),p=n=>toFa(String(n).padStart(2,'0'));
  TM.forEach(o=>{
    const it=o.it;let t,out=false,nx=false;
    if(it.finished){t='پایان یافته ✔';out=true}
    else if(!it.target)t='در حال دریافت زمان پخش...';
    else{
      const d=it.target+dl-now;
      if(d<=0){t='منتشر شد! ✅';out=true;nx=true;notify(it)}
      else t='⏳ '+toFa(Math.floor(d/864e5))+' روز و '+p(Math.floor(d%864e5/36e5))+':'+p(Math.floor(d%36e5/6e4))+':'+p(Math.floor(d%6e4/1e3))+(it.guess?' (تخمینی)':'');
    }
    if(o.t!==t){o.t=t;o.el.textContent=t}
    if(o.out!==out){o.out=out;o.el.classList.toggle('out',out)}
    if(o.nx!==nx){o.nx=nx;o.nb.hidden=!nx}
    if(first)o.w.textContent=it.target&&!it.finished?'پخش: '+FMT.format(it.target+dl):'';
  });
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden)updateTimers()});

DAYS.forEach(([k,l])=>{
  const b=document.createElement('button');
  b.className='tab'+(k==='all'?' active':'');b.textContent=l;
  b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');filter=k;render()};
  $('tabs').appendChild(b);
});
$('tplBtn').onclick=()=>{
  let cur='';try{cur=localStorage.getItem('anitracker_tpl')||''}catch(e){}
  let v=prompt('آدرس جستجوی سایت دانلود مورد نظرت را وارد کن.\nاز {name} برای نام، {ep} برای شماره قسمت و {year} برای سال استفاده کن.\nمثال: https://example.com/search?q={name}\nاگر فقط آدرس اصلی سایت را بدهی (مثل https://zarfilm.com/) خودش جستجو را می‌سازد. پیش‌فرض: زرفیلم.',cur);
  if(v===null)return;
  v=v.trim();
  if(v&&!v.includes('{')){
    try{const u=new URL(v);if(u.pathname==='/'&&!u.search)v=u.origin+'/?s={name}'}catch(e){}
  }
  try{localStorage.setItem('anitracker_tpl',v)}catch(e){}
  render();
};
function toast(t){const e=$('toast');e.textContent=t;e.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>e.hidden=true,4500)}
function parseZar(u){
  try{
    const x=new URL(u);if(!/(^|\.)zarfilm\.com$/i.test(x.hostname))return null;
    const p=x.pathname.split('/').filter(Boolean);
    let type='movie',sl=p[0];
    if(p[0]==='series'){type='show';sl=p[1]}
    if(!sl)return null;
    let year='';const m=/^(.*)-((?:19|20)\d\d)$/.exec(sl);
    if(type==='movie'&&m){sl=m[1];year=m[2]}
    return{type,year,name:sl.replace(/-+/g,' ').replace(/\b\w/g,c=>c.toUpperCase()).trim(),link:x.origin+x.pathname+'#dlbox'};
  }catch(e){return null}
}
$('mDay').innerHTML=DAYS.slice(1,8).map(([k,l])=>'<option value="'+k+'">'+l+'</option>').join('');
const syncType=()=>{const mv=$('mType').value==='movie';document.querySelectorAll('#admin [data-s]').forEach(e=>e.hidden=mv)};
$('mType').onchange=syncType;syncType();
$('mZar').onchange=()=>{
  const r=parseZar($('mZar').value.trim());if(!r){toast('این لینک زرفیلم نیست');return}
  $('mType').value=r.type;syncType();$('mName').value=r.name;$('mYear').value=r.year;$('mLink').value=r.link;
};
$('adminBtn').onclick=()=>{$('admin').hidden=false;pane('auto')};
const adOff=()=>$('admin').hidden=true;
$('adClose').onclick=adOff;
$('admin').addEventListener('mousedown',e=>{if(e.target===$('admin'))adOff()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')adOff()});
document.addEventListener('click',e=>{const d=document.querySelector('.menu');if(d&&!d.contains(e.target))d.open=false});
$('mAdd').onclick=async()=>{
  const name=$('mName').value.trim();if(!name){toast('نام را وارد کنید');return}
  const type=$('mType').value,year=$('mYear').value.trim();
  const it={id:uid(),name,type,year,day:$('mDay').value,episode:+$('mEp').value||1,image:$('mImg').value.trim(),target:0,link:$('mLink').value.trim(),state:'watching'};
  if(type!=='movie')fixTarget(it);
  list.push(it);save();render();
  ['mName','mYear','mImg','mLink','mZar'].forEach(id=>$(id).value='');
  $('admin').hidden=true;toast('«'+name+'» اضافه شد');
  if(!it.image){
    try{
      const rs=(await searchAll(name)).filter(x=>x.image);
      const pk=rs.find(x=>year&&String(x.year)===year)||rs.find(x=>(type==='movie')===(x.type==='movie'))||rs[0];
      if(pk)it.image=pk.image;
    }catch(e){}
  }
  if(it.image){it.image=await cacheImg(it.image);save();render()}
};
let rt;const rr=()=>{clearTimeout(rt);rt=setTimeout(render,120)};['q','stF','sortF'].forEach(id=>$(id).addEventListener('input',rr));
$('delayBtn').onclick=()=>{
  let cur='';try{cur=localStorage.getItem('anitracker_delay')||''}catch(e){}
  const v=prompt('چند ساعت بعد از پخش اصلی، قسمت در سایت دانلود آپلود می‌شود؟ (مثلاً 24). صفر یعنی بدون تأخیر.',cur||'0');
  if(v===null)return;
  try{localStorage.setItem('anitracker_delay',String(Math.max(0,+v||0)))}catch(e){}
  list.forEach(i=>i.notified=false);render();
};
$('notifBtn').onclick=async()=>{
  if(!('Notification' in window)){alert('این مرورگر اعلان را پشتیبانی نمی‌کند.');return}
  const r=await Notification.requestPermission();
  alert(r==='granted'?'اعلان فعال شد. فقط وقتی این صفحه باز باشد کار می‌کند.':'اجازه‌ی اعلان داده نشد.');
};
$('expBtn').onclick=()=>{
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify({list})],{type:'application/json'}));
  a.download='anitracker-backup.json';a.click();
};
$('impBtn').onclick=()=>$('impIn').click();
$('impIn').onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  try{const j=JSON.parse(await f.text());if(!Array.isArray(j.list))throw 0;
    list=j.list;list.forEach(it=>{if(!it.state)it.state='watching';fixTarget(it)});save();render();alert('اطلاعات وارد شد.');
  }catch(x){alert('فایل بکاپ معتبر نیست.')}
  e.target.value='';
};
render();setInterval(updateTimers,1000);setTimeout(fillMissing,1500);
</script>
