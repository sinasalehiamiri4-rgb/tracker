<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AniTracker Hub</title>
    <style>
        :root {
            --bg-color: #0f1015;
            --sidebar-bg: #16181f;
            --card-bg: #1e2029;
            --text-main: #ffffff;
            --text-muted: #9ca3af;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --success: #10b981;
            --warning: #f59e0b;
        }

        body {
            font-family: Tahoma, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
        }

        header {
            background-color: var(--sidebar-bg);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #2d3139;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--accent);
        }

        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }

        /* پنل ادمین */
        .admin-panel {
            background: var(--sidebar-bg);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #2d3139;
            margin-bottom: 30px;
        }

        .admin-panel h3 {
            margin-top: 0;
            color: var(--accent);
            font-size: 1.1rem;
            margin-bottom: 15px;
        }

        .admin-form {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .admin-form input, .admin-form select {
            background: var(--bg-color);
            border: 1px solid #2d3139;
            color: white;
            padding: 10px 15px;
            border-radius: 8px;
            font-family: Tahoma;
            flex: 1;
            min-width: 200px;
        }

        .admin-form button {
            background: var(--accent);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .admin-form button:hover {
            background: var(--accent-hover);
        }

        h2 {
            border-right: 4px solid var(--accent);
            padding-right: 12px;
            margin-bottom: 20px;
            font-size: 1.3rem;
        }

        .schedule-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            overflow-x: auto;
            padding-bottom: 5px;
        }

        .tab-btn {
            background: var(--sidebar-bg);
            color: var(--text-muted);
            border: 1px solid #2d3139;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            white-space: nowrap;
            transition: all 0.2s;
        }

        .tab-btn.active, .tab-btn:hover {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
        }

        .anime-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            border: 1px solid #2d3139;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: transform 0.2s;
        }

        .anime-card:hover {
            transform: translateY(-5px);
        }

        .card-img-box {
            width: 100%;
            height: 320px;
            position: relative;
            background: #111;
            overflow: hidden;
        }

        .card-img-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
        }

        .badge-ep {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0, 0, 0, 0.75);
            color: var(--accent);
            padding: 5px 12px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: bold;
            backdrop-filter: blur(5px);
            z-index: 2;
        }

        .card-body {
            padding: 15px;
        }

        .card-title {
            margin: 0 0 10px 0;
            font-size: 1.1rem;
            color: var(--text-main);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .countdown-text {
            font-size: 0.95rem;
            color: var(--warning);
            margin-bottom: 15px;
            font-weight: bold;
            text-align: right;
            direction: rtl;
        }

        .btn-dl {
            background: var(--accent);
            color: white;
            text-decoration: none;
            text-align: center;
            padding: 10px;
            border-radius: 8px;
            display: block;
            font-weight: bold;
            transition: background 0.2s;
        }

        .btn-dl:hover {
            background: var(--accent-hover);
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">⚡ AniTracker</div>
        <div style="color: var(--text-muted); font-size: 0.9rem;">سیستم پیگیری اختصاصی انیمه</div>
    </header>

    <div class="container">
        <!-- پنل ادمین برای افزودن انیمه جدید -->
        <div class="admin-panel">
            <h3>🛠 پنل ادمین (افزودن انیمه جدید)</h3>
            <div class="admin-form">
                <input type="text" id="animeNameInput" placeholder="نام انیمه (به انگلیسی، مثلا: Naruto)">
                <select id="animeDayInput">
                    <option value="saturday">شنبه</option>
                    <option value="sunday">یکشنبه</option>
                    <option value="monday">دوشنبه</option>
                    <option value="tuesday">سه‌شنبه</option>
                    <option value="wednesday">چهارشنبه</option>
                    <option value="thursday">پنجشنبه</option>
                    <option value="friday">جمعه</option>
                </select>
                <button onclick="addNewAnime()">اضافه کردن انیمه</button>
            </div>
        </div>

        <h2>📅 جدول پخش هفتگی انیمه‌ها</h2>
        
        <div class="schedule-tabs">
            <button class="tab-btn active" onclick="filterDay('all', this)">همه انیمه‌ها</button>
            <button class="tab-btn" onclick="filterDay('saturday', this)">شنبه</button>
            <button class="tab-btn" onclick="filterDay('sunday', this)">یکشنبه</button>
            <button class="tab-btn" onclick="filterDay('monday', this)">دوشنبه</button>
            <button class="tab-btn" onclick="filterDay('tuesday', this)">سه‌شنبه</button>
            <button class="tab-btn" onclick="filterDay('wednesday', this)">چهارشنبه</button>
            <button class="tab-btn" onclick="filterDay('thursday', this)">پنجشنبه</button>
            <button class="tab-btn" onclick="filterDay('friday', this)">جمعه</button>
        </div>

        <div class="grid-container" id="animeGrid"></div>
    </div>

    <script>
        function toPersianDigits(n) {
            const persianDigits = ['۰', '۱', '۲', '۳', '۴', '۵', '۶', '۷', '۸', '۹'];
            return n.toString().replace(/\d/g, x => persianDigits[x]);
        }

        // دیتای انیمه‌ها با روزهای پخش دقیق شما (بلک کلور شنبه، بلو باکس یکشنبه، پرنس آف تنیس چهارشنبه)
        let animeData = JSON.parse(localStorage.getItem('myAnimeList')) || [
            {
                name: "Black Clover",
                episode: "قسمت بعدی",
                day: "saturday",
                image: "https://cdn.myanimelist.net/images/anime/2/88336l.jpg",
                targetDate: "2026-10-10T18:00:00", 
                link: "#"
            },
            {
                name: "Blue Box",
                episode: "قسمت بعدی",
                day: "sunday",
                image: "https://cdn.myanimelist.net/images/anime/1092/142981l.jpg",
                targetDate: "2026-10-11T17:30:00",
                link: "#"
            },
            {
                name: "The Prince of Tennis",
                episode: "قسمت بعدی",
                day: "wednesday",
                image: "https://cdn.myanimelist.net/images/anime/11/75217l.jpg",
                targetDate: "2026-10-07T20:00:00",
                link: "#"
            }
        ];

        let currentFilter = 'all';

        async function addNewAnime() {
            const nameInput = document.getElementById('animeNameInput');
            const dayInput = document.getElementById('animeDayInput');
            const animeName = nameInput.value.trim();

            if (!animeName) {
                alert('لطفاً نام انیمه را وارد کنید.');
                return;
            }

            try {
                const response = await fetch(`https://api.jikan.moe/v4/anime?q=${encodeURIComponent(animeName)}&limit=1`);
                const data = await response.json();

                let imageUrl = "https://cdn.myanimelist.net/images/anime/1255/142475l.jpg";
                if (data.data && data.data.length > 0) {
                    imageUrl = data.data[0].images.jpg.large_image_url || data.data[0].images.jpg.image_url;
                }

                const newAnime = {
                    name: animeName,
                    episode: "قسمت بعدی",
                    day: dayInput.value,
                    image: imageUrl,
                    targetDate: new Date(Date.now() + 86400000 * 5).toISOString(),
                    link: "#"
                };

                animeData.push(newAnime);
                localStorage.setItem('myAnimeList', JSON.stringify(animeData));
                
                nameInput.value = '';
                renderAnime(currentFilter);
                alert('انیمه با موفقیت اضافه شد!');

            } catch (error) {
                alert('خطا در دریافت اطلاعات انیمه. لطفاً دوباره تلاش کنید.');
            }
        }

        function renderAnime(filter = 'all') {
            currentFilter = filter;
            const grid = document.getElementById('animeGrid');
            grid.innerHTML = '';

            const filtered = filter === 'all' ? animeData : animeData.filter(item => item.day === filter);

            if (filtered.length === 0) {
                grid.innerHTML = `<p style="color: var(--text-muted); grid-column: 1/-1; text-align: center;">انیمه‌ای برای این روز ثبت نشده است.</p>`;
                return;
            }

            filtered.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'anime-card';

                card.innerHTML = `
                    <div>
                        <div class="card-img-box">
                            <span class="badge-ep">${item.episode}</span>
                            <img src="${item.image}" alt="${item.name}">
                        </div>
                        <div class="card-body">
                            <h3 class="card-title" title="${item.name}">${item.name}</h3>
                            <div class="countdown-text" id="timer-${index}">در حال محاسبه...</div>
                        </div>
                    </div>
                    <div style="padding: 0 15px 15px 15px;">
                        <a href="${item.link}" target="_blank" class="btn-dl">🔗 لینک دانلود</a>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function filterDay(day, btnElement) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');
            renderAnime(day);
        }

        renderAnime('all');
        setInterval(updateTimers, 1000);

        function updateTimers() {
            animeData.forEach((item, index) => {
                const timerEl = document.getElementById(`timer-${index}`);
                if (!timerEl) return;

                const now = new Date().getTime();
                const target = new Date(item.targetDate).getTime();
                const diff = target - now;

                if (diff <= 0) {
                    timerEl.innerHTML = "منتشر شد! ✅";
                    timerEl.style.color = "var(--success)";
                } else {
                    const days = Math.floor(diff / (1000 * 60 * 60 * 24));
                    const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                    const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                    const seconds = Math.floor((diff % (1000 * 60)) / 1000);

                    const pDays = toPersianDigits(days);
                    const pHours = toPersianDigits(String(hours).padStart(2, '0'));
                    const pMinutes = toPersianDigits(String(minutes).padStart(2, '0'));
                    const pSeconds = toPersianDigits(String(seconds).padStart(2, '0'));

                    timerEl.innerHTML = `⏳ ${pDays} روز و ${pHours}:${pMinutes}:${pSeconds}`;
                }
            });
        }
    </script>

</body>
</html>
