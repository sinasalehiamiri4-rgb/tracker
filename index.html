<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AniTracker Hub</title>
<style>
:root{--bg:#0f1015;--side:#16181f;--card:#1e2029;--text:#fff;--muted:#9ca3af;--accent:#6366f1;--accent2:#4f46e5;--ok:#10b981;--warn:#f59e0b;--line:#2d3139}
*{box-sizing:border-box}
body{font-family:Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text);margin:0}
header{background:var(--side);padding:15px 30px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
.logo{font-size:1.5rem;font-weight:bold;color:var(--accent)}
.container{max-width:1200px;margin:30px auto;padding:0 20px}
.admin{background:var(--side);padding:20px;border-radius:12px;border:1px solid var(--line);margin-bottom:30px}
.admin h3{margin:0 0 15px;color:var(--accent);font-size:1.1rem}
.form{display:flex;gap:12px;flex-wrap:wrap}
.form input,.form select{background:var(--bg);border:1px solid var(--line);color:#fff;padding:10px 15px;border-radius:8px;font-family:inherit;flex:1;min-width:200px}
.form button{background:var(--accent);color:#fff;border:0;padding:10px 20px;border-radius:8px;font-weight:bold;cursor:pointer;font-family:inherit}
.form button:hover{background:var(--accent2)}
.form button:disabled{opacity:.6;cursor:wait}
:focus-visible{outline:2px solid var(--warn);outline-offset:2px}
h2{border-right:4px solid var(--accent);padding-right:12px;margin-bottom:20px;font-size:1.3rem}
.tabs{display:flex;gap:10px;margin-bottom:25px;overflow-x:auto;padding-bottom:5px}
.tab{background:var(--side);color:var(--muted);border:1px solid var(--line);padding:10px 20px;border-radius:8px;cursor:pointer;font-weight:bold;white-space:nowrap;font-family:inherit}
.tab.active,.tab:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:20px}
.card{background:var(--card);border-radius:12px;overflow:hidden;box-shadow:0 4px 10px rgba(0,0,0,.3);border:1px solid var(--line);display:flex;flex-direction:column;transition:transform .2s}
.card:hover{transform:translateY(-4px)}
.img{width:100%;aspect-ratio:2/3;position:relative;overflow:hidden;background:linear-gradient(110deg,#181a22 30%,#242733 50%,#181a22 70%);background-size:200% 100%;animation:sk 1.4s linear infinite}
.img.loaded{animation:none;background:#111}
@keyframes sk{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.img{animation:none}.card{transition:none}}
.img img{width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .3s}
.img.loaded img{opacity:1}
.badge{position:absolute;top:10px;left:10px;background:rgba(0,0,0,.75);color:var(--accent);padding:5px 12px;border-radius:6px;font-size:.8rem;font-weight:bold;backdrop-filter:blur(5px);z-index:2}
.del{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.75);color:#f87171;border:0;border-radius:6px;width:30px;height:30px;cursor:pointer;z-index:2}
.body{padding:15px;flex:1}
.title{margin:0 0 10px;font-size:1.05rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.timer{font-size:.95rem;color:var(--warn);font-weight:bold;direction:rtl}
.timer.out{color:var(--ok)}
.actions{padding:0 15px 15px;display:grid;gap:8px}
.btn{background:var(--accent);color:#fff;text-decoration:none;text-align:center;padding:10px;border-radius:8px;display:block;font-weight:bold;border:0;cursor:pointer;font-family:inherit;font-size:.9rem}
.btn:hover{background:var(--accent2)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--muted)}
.btn.ghost:hover{border-color:var(--accent);color:#fff}
.btn.ok{background:var(--ok)}
.empty{color:var(--muted);grid-column:1/-1;text-align:center}
</style>
</head>
<body>
<header>
  <div class="logo">⚡ AniTracker</div>
  <div style="color:var(--muted);font-size:.9rem">سیستم پیگیری اختصاصی انیمه</div>
</header>

<div class="container">
  <div class="admin">
    <h3>🛠 افزودن انیمه جدید</h3>
    <div class="form">
      <input type="text" id="nameIn" placeholder="نام انیمه (انگلیسی، مثلا: Naruto)">
      <select id="dayIn">
        <option value="saturday">شنبه</option><option value="sunday">یکشنبه</option>
        <option value="monday">دوشنبه</option><option value="tuesday">سه‌شنبه</option>
        <option value="wednesday">چهارشنبه</option><option value="thursday">پنجشنبه</option>
        <option value="friday">جمعه</option>
      </select>
      <button id="addBtn">اضافه کردن انیمه</button>
    </div>
  </div>

  <h2>📅 جدول پخش هفتگی انیمه‌ها</h2>
  <div class="tabs" id="tabs"></div>
  <div class="grid" id="grid"></div>
</div>

<script>
const DAYS=[['all','همه انیمه‌ها'],['saturday','شنبه'],['sunday','یکشنبه'],['monday','دوشنبه'],['tuesday','سه‌شنبه'],['wednesday','چهارشنبه'],['thursday','پنجشنبه'],['friday','جمعه']];
const JS_DAY={sunday:0,monday:1,tuesday:2,wednesday:3,thursday:4,friday:5,saturday:6};
const KEY='anitracker_v2';
const PLACEHOLDER='data:image/svg+xml;utf8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="300" height="450"><rect width="100%" height="100%" fill="#1e2029"/><text x="50%" y="50%" fill="#6b7280" font-size="20" text-anchor="middle" font-family="Arial">No Image</text></svg>');

const toFa=n=>String(n).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);

function load(){
  try{const s=JSON.parse(localStorage.getItem(KEY));if(Array.isArray(s))return s}catch(e){}
  return [
    {id:uid(),name:'Black Clover',day:'saturday',episode:1,image:'',target:0,link:''},
    {id:uid(),name:'Blue Box',day:'sunday',episode:1,image:'',target:0,link:''},
    {id:uid(),name:'The Prince of Tennis',day:'wednesday',episode:1,image:'',target:0,link:''}
  ];
}
let list=load(),filter='all';
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(list))}catch(e){}};

/* ---- محاسبه زمان پخش بعدی ---- */
// از زمان پخش واقعی (ژاپن) استفاده می‌کند
function nextFromBroadcast(day,time){
  const m=/^(\d{1,2}):(\d{2})$/.exec(time||'');
  const idx=['sunday','monday','tuesday','wednesday','thursday','friday','saturday'].indexOf((day||'').toLowerCase().replace(/s$/,''));
  if(!m||idx<0)return 0;
  const jst=Date.now()+9*3600e3, base=new Date(jst);
  for(let i=0;i<=7;i++){
    const c=Date.UTC(base.getUTCFullYear(),base.getUTCMonth(),base.getUTCDate()+i,+m[1],+m[2]);
    if(new Date(c).getUTCDay()===idx&&c>jst)return c-9*3600e3;
  }
  return 0;
}
function nextFromDay(dayKey){
  const d=new Date();d.setHours(20,0,0,0);
  let add=(JS_DAY[dayKey]-d.getDay()+7)%7;
  if(add===0&&d<=new Date())add=7;
  d.setDate(d.getDate()+add);return d.getTime();
}

/* ---- دریافت اطلاعات واقعی از Jikan ---- */
async function fetchInfo(name){
  const r=await fetch('https://api.jikan.moe/v4/anime?q='+encodeURIComponent(name)+'&limit=1&sfw=true&order_by=popularity');
  if(!r.ok)throw new Error('HTTP '+r.status);
  const j=await r.json(), a=j.data&&j.data[0];
  if(!a)return null;
  const im=a.images.webp||a.images.jpg;
  return {
    title:a.title,
    image:im.large_image_url||im.image_url||'',
    target:nextFromBroadcast(a.broadcast&&a.broadcast.day,a.broadcast&&a.broadcast.time)
  };
}
async function enrich(item){
  try{
    const info=await fetchInfo(item.name);
    if(info){item.image=info.image;item.target=info.target||nextFromDay(item.day);}
    else item.target=nextFromDay(item.day);
  }catch(e){
    item.target=item.target||nextFromDay(item.day);
  }
  item.fetched=true;save();render();
}
async function enrichAll(){
  for(const it of list){
    if(!it.fetched){await enrich(it);await sleep(450);} // رعایت محدودیت نرخ API
  }
}

/* ---- لینک دانلود ---- */
function dlLink(it){
  const ep=String(it.episode).padStart(2,'0');
  if(it.link)return it.link.replace('{ep}',ep);
  return 'https://www.google.com/search?q='+encodeURIComponent(it.name+' episode '+ep+' download');
}

/* ---- رندر ---- */
function render(){
  const grid=document.getElementById('grid');
  grid.textContent='';
  const items=filter==='all'?list:list.filter(i=>i.day===filter);
  if(!items.length){
    const p=document.createElement('p');p.className='empty';
    p.textContent='انیمه‌ای برای این روز ثبت نشده است. از پنل بالا اضافه کنید.';
    grid.appendChild(p);return;
  }
  items.forEach(it=>{
    const c=document.createElement('div');c.className='card';
    c.innerHTML=`
      <div class="img">
        <span class="badge"></span>
        <button class="del" title="حذف" aria-label="حذف">✕</button>
        <img loading="lazy" referrerpolicy="no-referrer" alt="">
      </div>
      <div class="body">
        <h3 class="title"></h3>
        <div class="timer" data-id="${it.id}">در حال محاسبه...</div>
      </div>
      <div class="actions">
        <a class="btn dl" target="_blank" rel="noopener">⬇ دانلود قسمت جدید</a>
        <button class="btn ok next" hidden>✔ دانلود شد، قسمت بعدی</button>
        <button class="btn ghost setlink">✏️ تنظیم لینک دانلود</button>
      </div>`;
    c.querySelector('.badge').textContent='قسمت '+toFa(it.episode);
    const t=c.querySelector('.title');t.textContent=it.name;t.title=it.name;
    const box=c.querySelector('.img'),img=c.querySelector('img');
    img.alt=it.name;
    img.onload=()=>box.classList.add('loaded');
    img.onerror=()=>{img.onerror=null;img.src=PLACEHOLDER;};
    img.src=it.image||PLACEHOLDER;
    c.querySelector('.dl').href=dlLink(it);
    c.querySelector('.del').onclick=()=>{
      if(confirm('«'+it.name+'» حذف شود؟')){list=list.filter(x=>x.id!==it.id);save();render();}
    };
    c.querySelector('.next').onclick=()=>{
      it.episode++;it.target=(it.target||Date.now())+7*86400e3;
      while(it.target<Date.now())it.target+=7*86400e3;
      save();render();
    };
    c.querySelector('.setlink').onclick=()=>{
      const v=prompt('لینک دانلود را وارد کنید. برای شماره قسمت از {ep} استفاده کنید.\nمثال: https://site.com/'+it.name.replace(/\s/g,'-')+'-{ep}.mkv',it.link||'');
      if(v!==null){it.link=v.trim();save();render();}
    };
    grid.appendChild(c);
  });
  updateTimers();
}

function updateTimers(){
  document.querySelectorAll('.timer').forEach(el=>{
    const it=list.find(x=>x.id===el.dataset.id);if(!it)return;
    const card=el.closest('.card'),nextBtn=card.querySelector('.next');
    if(!it.target){el.textContent='در حال دریافت زمان پخش...';return;}
    const diff=it.target-Date.now();
    if(diff<=0){
      el.textContent='منتشر شد! ✅';el.classList.add('out');nextBtn.hidden=false;
    }else{
      el.classList.remove('out');nextBtn.hidden=true;
      const d=Math.floor(diff/864e5),h=Math.floor(diff%864e5/36e5),m=Math.floor(diff%36e5/6e4),s=Math.floor(diff%6e4/1e3);
      const p=n=>toFa(String(n).padStart(2,'0'));
      el.textContent='⏳ '+toFa(d)+' روز و '+p(h)+':'+p(m)+':'+p(s);
    }
  });
}

/* ---- افزودن انیمه ---- */
document.getElementById('addBtn').onclick=async function(){
  const inp=document.getElementById('nameIn'),name=inp.value.trim();
  if(!name){alert('لطفاً نام انیمه را وارد کنید.');return;}
  this.disabled=true;
  const it={id:uid(),name,day:document.getElementById('dayIn').value,episode:1,image:'',target:0,link:''};
  list.push(it);save();inp.value='';render();
  await enrich(it);
  this.disabled=false;
};
document.getElementById('nameIn').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('addBtn').click();});

/* ---- تب‌ها ---- */
const tabs=document.getElementById('tabs');
DAYS.forEach(([k,label])=>{
  const b=document.createElement('button');
  b.className='tab'+(k==='all'?' active':'');b.textContent=label;
  b.onclick=()=>{tabs.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');filter=k;render();};
  tabs.appendChild(b);
});

render();
setInterval(updateTimers,1000);
enrichAll();
</script>
</body>
</html>
